<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFFF"/>
      <stop offset="50%" stop-color="#00CCCC"/>
      <stop offset="100%" stop-color="#008888"/>
    </linearGradient>
  </defs>
  <!-- Outer dark edge -->
  <rect x="0" y="0" width="256" height="256" fill="#061018"/>
  <!-- Neon line (bright) -->
  <rect x="2" y="2" width="252" height="252" fill="url(#bd)"/>
  <!-- Glow bright -->
  <rect x="4" y="4" width="248" height="248" fill="#006666"/>
  <!-- Glow mid -->
  <rect x="6" y="6" width="244" height="244" fill="#004444"/>
  <!-- Glow dim -->
  <rect x="8" y="8" width="240" height="240" fill="#003333"/>
  <!-- Inner accent -->
  <rect x="10" y="10" width="236" height="236" fill="#001818"/>
  <!-- Body (dark) -->
  <rect x="12" y="12" width="232" height="232" fill="#0A0E14"/>
</svg>